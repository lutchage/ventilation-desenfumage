<svg xmlns="http://www.w3.org/2000/svg" viewBox="53 110 406 406">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1E88E5"/>
    </marker>
  </defs>
  <g fill="none" stroke="#455A64" stroke-linecap="round" stroke-linejoin="round">
    <!-- façades et acrotères -->
    <polyline points="72,232 72,468 440,468 440,232" stroke-width="30"/>
    <!-- toit plat avec trémie au centre gauche -->
    <line x1="72" y1="262" x2="170" y2="262" stroke-width="28"/>
    <line x1="262" y1="262" x2="440" y2="262" stroke-width="28"/>
    <!-- costière -->
    <line x1="170" y1="262" x2="170" y2="222" stroke-width="22"/>
    <line x1="262" y1="262" x2="262" y2="222" stroke-width="22"/>
    <!-- escalier, monte de gauche à droite -->
    <polyline points="112,468 112,428 162,428 162,388 212,388 212,348 262,348 262,320 330,320" stroke-width="22"/>
  </g>
  <!-- panneau solaire -->
  <line x1="342" y1="238" x2="414" y2="210" stroke="#1F4E8C" stroke-width="20" stroke-linecap="round"/>
  <line x1="400" y1="248" x2="400" y2="218" stroke="#455A64" stroke-width="10"/>
  <!-- coupole relevée (charnière à gauche) -->
  <g transform="rotate(-26 170 222)">
    <path d="M170 222 A48 50 0 0 1 266 222 Z" fill="#FFE0B2" stroke="#FB8C00" stroke-width="18" stroke-linejoin="round"/>
  </g>
  <!-- flux d'air vers la droite -->
  <g fill="none" stroke="#1E88E5" stroke-width="20" stroke-linecap="round" marker-end="url(#ah)">
    <path d="M214 334 C214 280 240 236 282 184"/>
    <path d="M250 334 C250 288 276 248 320 206"/>
  </g>
</svg>
